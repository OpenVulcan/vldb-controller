[package]
name = "vldb-controller-client"
# Release the additive host SDK independently; the controller wire protocol and binary version are unchanged.
# 独立发布增量宿主 SDK；控制器线协议及二进制版本不变。
version = "0.2.5"
edition.workspace = true
rust-version.workspace = true
description = "Host-side Rust SDK and gRPC contract bindings for vldb-controller."
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["vldb", "controller", "grpc", "sdk"]
categories = ["api-bindings", "database"]

[lib]
name = "vldb_controller_client"
crate-type = ["rlib"]

[dependencies]
prost.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tonic.workspace = true
tonic-prost.workspace = true

[build-dependencies]
protoc-bin-vendored.workspace = true
tonic-prost-build.workspace = true
